<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Матрица Судьбы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d4af37;--gold-light:#f4e5b1;--gold-dark:#8b6914;
  --maroon:#4a0e0e;--maroon-deep:#2a0505;--saffron:#ff9933;
  --cream:#fdf6e3;--accent:#ff6b35;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--maroon-deep);color:var(--cream);font-family:Roboto,sans-serif;min-height:100%}
body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(circle at 20% 10%,rgba(212,175,55,.08),transparent 40%),
    radial-gradient(circle at 80% 80%,rgba(255,107,53,.06),transparent 45%),
    repeating-conic-gradient(from 0deg at 50% 50%,rgba(212,175,55,.03) 0deg 15deg,transparent 15deg 30deg);
}
.app{position:relative;z-index:1;max-width:720px;margin:auto;padding:20px 16px 100px}
header{text-align:center;padding:12px 0 4px}
h1{font-family:'Roboto Slab',serif;font-weight:700;font-size:26px;letter-spacing:1.5px;
  color:var(--gold-light);text-transform:uppercase;line-height:1.2}
.subtitle{font-family:'Roboto Slab',serif;font-weight:400;font-size:13px;letter-spacing:2px;
  color:var(--gold);opacity:.9;margin-top:6px}
.divider{position:relative;text-align:center;color:var(--gold);font-size:12px;
  margin:20px 0;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  background-size:100% 1px;background-repeat:no-repeat;background-position:center}
.divider::before{content:'❖';position:relative;top:-8px;background:var(--maroon-deep);
  padding:0 10px;font-size:12px;color:var(--gold)}
.form-card{position:relative;background:linear-gradient(145deg,rgba(74,14,14,.9),rgba(42,5,5,.95));
  border:1px solid var(--gold-dark);border-radius:16px;padding:22px 18px;margin-bottom:22px;
  box-shadow:0 8px 32px rgba(0,0,0,.5),inset 0 0 0 1px rgba(212,175,55,.1)}
.form-card::before{content:'';position:absolute;inset:6px;border:1px solid rgba(212,175,55,.2);
  border-radius:12px;pointer-events:none}
label{display:block;font-family:'Roboto',sans-serif;font-weight:600;font-size:12px;
  letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
input{width:100%;background:rgba(0,0,0,.35);border:1px solid rgba(212,175,55,.35);
  border-radius:8px;padding:12px 14px;color:var(--cream);font-family:Roboto,sans-serif;
  font-size:16px;margin-bottom:16px;outline:none;transition:.25s}
input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
input[type=date]{color-scheme:dark}
.btn{width:100%;background:linear-gradient(135deg,var(--gold-dark),var(--gold),var(--gold-dark));
  color:var(--maroon-deep);border:0;border-radius:10px;padding:14px;font-family:'Roboto Slab',serif;
  font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:2px;cursor:pointer;
  box-shadow:0 4px 16px rgba(212,175,55,.35);transition:.25s}
.btn:hover{box-shadow:0 6px 24px rgba(212,175,55,.55)}
.btn:active{transform:scale(.97)}
.loading{display:none;text-align:center;padding:40px 0;font-family:'Roboto Slab',serif;
  font-weight:500;color:var(--gold);letter-spacing:2px}
.loading.show{display:block}
.spinner{width:40px;height:40px;border:3px solid rgba(212,175,55,.2);border-top-color:var(--gold);
  border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes resetIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}
  to{opacity:1;transform:translateX(-50%) translateY(0)}}
.numbers-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.num-badge{background:radial-gradient(circle at 50% 30%,rgba(212,175,55,.18),rgba(74,14,14,.85));
  border:1px solid var(--gold-dark);border-radius:12px;padding:14px 6px;text-align:center}
.num-badge .label{font-family:'Roboto Slab',serif;font-weight:600;font-size:10px;
  letter-spacing:1px;text-transform:uppercase;color:var(--gold)}
.num-badge .value{font-family:'Roboto Slab',serif;font-weight:700;font-size:38px;
  color:var(--gold-light);text-shadow:0 0 15px rgba(212,175,55,.5);line-height:1.1;margin-top:4px}
.num-badge .planet{font-family:Roboto,sans-serif;font-size:10px;font-style:italic;
  color:var(--saffron);margin-top:4px}
.section{background:linear-gradient(160deg,rgba(74,14,14,.85),rgba(42,5,5,.9));
  border:1px solid var(--gold-dark);border-radius:14px;margin-bottom:16px;overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,.4);animation:fadeIn .5s ease}
.section-header{display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;background:linear-gradient(90deg,rgba(212,175,55,.12),transparent);
  border-bottom:1px solid rgba(212,175,55,.2);cursor:pointer;user-select:none}
.section-header h2{display:flex;align-items:center;gap:8px;font-family:'Roboto Slab',serif;
  font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--gold-light)}
.icon{font-size:16px;color:var(--gold)}
.chev{font-size:14px;color:var(--gold);transition:.3s}
.section.open .chev{transform:rotate(180deg)}
.section-body{max-height:0;overflow:hidden;transition:max-height .5s ease}
.section.open .section-body{max-height:40000px}
.section-inner{padding:16px 18px 20px}
.section-inner p{font-family:Roboto,sans-serif;font-weight:400;font-size:15px;line-height:1.7;
  color:var(--cream);text-align:justify;margin-bottom:12px}
.section-inner p:last-child{margin-bottom:0}
.section-inner strong{font-family:'Roboto Slab',serif;font-weight:600;color:var(--gold-light)}
.section-inner em{color:var(--saffron);font-style:italic}
.block-title{font-family:'Roboto Slab',serif;font-weight:600;font-size:12px;text-transform:uppercase;
  letter-spacing:1.5px;color:var(--gold);margin:16px 0 8px;padding-bottom:6px;
  border-bottom:1px solid rgba(212,175,55,.25)}
.block-title:first-child{margin-top:0}
.tag-row{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.4);border-radius:20px;
  padding:4px 10px;font-family:Roboto,sans-serif;font-size:12px;color:var(--gold-light);letter-spacing:.5px}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.info-cell{background:rgba(0,0,0,.3);border-left:3px solid var(--gold);padding:8px 12px;border-radius:4px}
.info-cell .k{font-family:'Roboto Slab',serif;font-weight:600;font-size:10px;text-transform:uppercase;
  letter-spacing:1px;color:var(--gold)}
.info-cell .v{font-family:Roboto,sans-serif;font-weight:500;font-size:14px;color:var(--cream);margin-top:2px}
.mantra{background:rgba(0,0,0,.4);border:1px dashed var(--gold-dark);border-radius:8px;padding:12px;
  text-align:center;font-family:'Roboto Slab',serif;font-weight:500;font-size:14px;color:var(--gold-light);
  letter-spacing:1px;margin-top:10px;line-height:1.6}
.warning{background:rgba(255,107,53,.1);border:1px solid rgba(255,107,53,.4);border-radius:8px;
  padding:12px 14px;margin-top:12px;font-family:Roboto,sans-serif;font-size:14px;line-height:1.6;color:var(--cream)}
.warning::before{content:'⚠ ';color:var(--accent);font-weight:700}
.reset-btn{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:50;
  padding:13px 30px;background:linear-gradient(135deg,var(--gold-dark),var(--gold),var(--gold-dark));
  color:var(--maroon-deep);border:1px solid var(--gold-light);border-radius:30px;
  font-family:'Roboto Slab',serif;font-weight:700;font-size:13px;text-transform:uppercase;
  letter-spacing:1.5px;cursor:pointer;display:none;
  box-shadow:0 6px 24px rgba(0,0,0,.6),0 0 20px rgba(212,175,55,.4)}
.reset-btn.show{display:block;animation:resetIn .4s ease}
.reset-btn:active{transform:translateX(-50%) scale(.95)}
.matrix-svg{width:100%;height:auto;display:block;margin:0 auto;max-width:520px}
.matrix-svg text{font-family:'Roboto Slab',serif;font-weight:700;fill:var(--gold-light)}
.matrix-svg circle.node{fill:rgba(74,14,14,.85);stroke:var(--gold-dark);stroke-width:1.5}
.matrix-svg circle.node.big{stroke:var(--gold);stroke-width:2}
.matrix-svg circle.node.center{fill:rgba(212,175,55,.22);stroke:var(--gold);stroke-width:2}
.matrix-svg line{stroke:rgba(212,175,55,.5);stroke-width:1}
@media (max-width:400px){
  h1{font-size:21px}
  .num-badge .value{font-size:32px}
  .info-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Матрица Судьбы</h1>
    <div class="subtitle">Расчёт по 22 арканам · Наталья Ладини</div>
  </header>
  <div class="divider"></div>

  <div class="form-card">
    <label for="fio">ФИО</label>
    <input type="text" id="fio" placeholder="Иванова Мария Сергеевна" autocomplete="name">
    <label for="bdate">Дата рождения</label>
    <input type="date" id="bdate">
    <button class="btn" id="calcBtn">Рассчитать матрицу</button>
  </div>

  <div class="loading" id="loading"><div class="spinner"></div>Расчёт матрицы…</div>
  <div id="results"></div>
</div>

<button class="reset-btn" id="resetBtn">Сбросить</button>

<script>
/* ============ TELEGRAM ============ */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready(); tg.expand();
  tg.setHeaderColor?.('#2a0505');
  tg.setBackgroundColor?.('#2a0505');
}
function notify(msg){
  if (tg && tg.showAlert) tg.showAlert(msg);
  else alert(msg);
}

/* ============ ЯДРО РАСЧЁТА ============ */
const REDUCE = n => { n = Math.abs(parseInt(n,10))||0; while (n>22) n = String(n).split('').reduce((a,b)=>a+ +b,0); return n; };

function calcMatrix(day, month, year){
  // личностный (диагональный) квадрат
  const A = REDUCE(day);                 // левая вершина (день)
  const B = REDUCE(month);               // верхняя (месяц) — 1..22
  const C = REDUCE(year);                // правая (год)
  const D = REDUCE(A + B + C);           // нижняя
  const E = REDUCE(A + B + C + D);       // центр (характер)

  // родовой (прямой) квадрат
  const TL = REDUCE(A + B);              // талант отца / дух. задачи мужского рода
  const TR = REDUCE(B + C);              // талант матери / дух. задачи женского рода
  const BR = REDUCE(C + D);              // карма отца / материальная карма мужского рода
  const BL = REDUCE(D + A);              // карма матери / материальная карма женского рода

  // предназначения
  const sky   = REDUCE(B + D);           // линия Неба
  const earth = REDUCE(A + C);           // линия Земли
  const LP    = REDUCE(sky + earth);     // личное предназначение
  const M     = REDUCE(TL + BR);         // род отца
  const J     = REDUCE(TR + BL);         // род матери
  const SP    = REDUCE(M + J);           // социальное предназначение
  const DP    = REDUCE(LP + SP);         // духовное (общее) предназначение

  // кармический хвост (нижний треугольник)
  const KH_bottom = D;                   // 13
  const KH_left   = REDUCE(D + E);       // 21
  const KH_right  = REDUCE(D + KH_left); // 7

  // таланты (верхний треугольник)
  const T_top   = B;                     // 1
  const T_mid   = REDUCE(B + E);         // 9
  const T_inner = REDUCE(B + T_mid);     // 10

  // детско-родительский канал (левый ключ)
  const DR_outer = A;                    // 5
  const DR_mid   = REDUCE(A + E);        // 13
  const DR_inner = REDUCE(A + DR_mid);   // 18

  // канал отношений + финансов (правый ключ)
  const F_mid    = REDUCE(E + C);                       // 15
  const F_cross  = REDUCE(KH_left + F_mid);             // 9
  const F_rel    = REDUCE(KH_left + F_cross);           // 3 (центр отношений)
  const F_fin    = REDUCE(F_mid + F_cross);             // 6 (центр финансов)
  const MatKarma = REDUCE(F_mid + C);                   // 22 (материальная карма)

  // род отца — диагональ TL↔BR
  const RO_inner_left  = REDUCE(TL + E);   // 14
  const RO_mid_left    = REDUCE(TL + RO_inner_left); // 20
  const RO_inner_right = REDUCE(BR + E);   // 10
  const RO_mid_right   = REDUCE(BR + RO_inner_right); // 3

  // род матери — диагональ TR↔BL
  const RM_inner_tr = REDUCE(TR + E);      // 16
  const RM_mid_tr   = REDUCE(TR + RM_inner_tr); // 6
  const RM_inner_bl = REDUCE(BL + E);      // 8
  const RM_mid_bl   = REDUCE(BL + RM_inner_bl); // 8

  // число года (текущий год → сумма цифр → аркан)
  const currentYear = new Date().getFullYear();
  const yearNum = REDUCE(currentYear);

  return {A,B,C,D,E,TL,TR,BR,BL,sky,earth,LP,M,J,SP,DP,
    KH_bottom,KH_left,KH_right,
    T_top,T_mid,T_inner,
    DR_outer,DR_mid,DR_inner,
    F_mid,F_cross,F_rel,F_fin,MatKarma,
    RO_inner_left,RO_mid_left,RO_inner_right,RO_mid_right,
    RM_inner_tr,RM_mid_tr,RM_inner_bl,RM_mid_bl,
    yearNum, currentYear,
    day, month, year};
}

/* ============ КАРТА ЭНЕРГИЙ (22 аркана) ============ */
const EN = {
1:{n:'Маг, Волшебник, Чудотворец',p:'Лидер и новатор. Изобретательность, оптимизм, множество идей. Тонко видит мир. Любит роскошь. Инициирует других к действиям. Верит в успех, быстрая реализация желаний. Авантюризм, свободолюбие, самостоятельность.',m:'Эгоизм, гордыня, комплексы. Страх начать новое дело. Не признаёт конкуренцию, не выносит критику. Бросает начатое. Можно поймать на «слабо». Считает себя выше других. Не умеет прощать. Не верит в свои силы.',l:'Выровняться с другими людьми и раскрыть свой потенциал.'},
2:{n:'Единство, Равенство, Гармония',p:'Дипломатичен, способен урегулировать любой конфликт. Сильная интуиция, понимает суть происходящего. Общителен, много друзей. «Серый кардинал». Наблюдательный, любит природу.',m:'Склонен к сплетням, ссорит окружающих. Озлоблен на весь мир. Противоречив, двойственен. Ленив, пассивен, нерешителен. Скрытен, много поверхностных связей. Проблемы с бесплодием.',l:'Преодолеть пассивность, больше действовать, быть открытым, говорить, что думаешь.'},
3:{n:'Императрица, Хозяйка',p:'Истинная женщина/хозяин. Красива, статна, следит за собой. Настоящая хозяйка, лидерство, материнство. Правление с мудростью. Любовь к природе, плодородие. Дом — полная чаша.',m:'Малоэмоциональна, эмансипирована. Контролирует всё, подавляет мужчин. Одинока, не романтична. Зациклена на деньгах. Не следит за собой. Перегибы в воспитании ребёнка.',l:'Женщине — с любовью воспринимать мир. Мужчине — работать над мужской энергией.'},
4:{n:'Император, Хозяин',p:'Ответственен, работоспособен, уверен в себе. Даёт близким чувство защищённости. Хороший отец/мать. Формирует события. Авторитет, руководитель, бизнес. Логика, структура.',m:'Деспотичен, стремится всё контролировать. Идёт к власти любой ценой. Жесток, тиран. Прагматичен, не умеет выражать эмоции. Инфантилен. Слабже отца.',l:'Мужчине — быть императором без давления. Женщине — быть мягче, доверять партнёру.'},
5:{n:'Учитель, Ученик, Закон',p:'Талант учителя, всю жизнь учится и передаёт знания. Порядок во всём. Оратор, логическое мышление. Ответственный, надёжный. Семейные традиции. Духовный наставник.',m:'Не хочет учиться или перегибы. Не передаёт знания. Поучает, навязывает идеи. Беспорядок в делах. Опаздывает. Бунтует, управляет через слабости. Гордыня. Проблемы с семьёй и законом.',l:'Уважать мнение других, воспринимать другие учения.'},
6:{n:'Любовь, Отношения, Выбор',p:'Общителен, бесконфликтен, умеет расположить. Много друзей, законодатель моды. Уютный дом, гостеприимство. Умеет любить, открытое сердце. Телесные удовольствия.',m:'Ранимый, депрессивный, одинокий, закрытое сердце. Мстителен, обидчив. Деньги важнее отношений. Шопоголик. Зависим от чужого мнения. Не умеет делать выбор.',l:'Принять себя и мир в целостности. Безусловная любовь.'},
7:{n:'Воин, Победитель, Движение',p:'Яркий лидер, карьерист. Ставит цель и планомерно идёт. Верен цели. Умеет руководить и делегировать. Настойчив, нацелен на результат. Лёгок на подъём. Любит путешествия.',m:'Ленив, нет движения. Безответственен, не доводит до конца. Не доверяет коллективу. Агрессивен, идёт по головам. Зациклен на деньгах. Заниженная самооценка.',l:'Всё время двигаться, ставить цели.'},
8:{n:'Справедливость',p:'Тонко чувствует причинно-следственные законы. Доверяет судьбе. Хорошее образование, руководитель. Честен, не нарушает законы. Отличный координатор. Освободился от негативных родительских установок.',m:'Обидчив, осуждает, депрессивен. Тяжёлая карма, проблемы с оценкой реальности. Лжёт, манипулирует. Двойные стандарты. Зависимости. Мстителен. Не верит в свою значимость.',l:'Изучить кармический закон бытия, понять причинно-следственную связь.'},
9:{n:'Мудрец, Отшельник',p:'Мудрость, к советам прислушиваются. Стремится к гармонии, не любит суету. Глубоко изучает и передаёт знания. В меру аскетичен. Поздно вступает в брак. Верный друг. Любит одиночество.',m:'Замкнут, чрезмерно аскетичен, уходит от мира. Не любит себя и мир. Не заботится о здоровье. Осуждает из гордыни. Ревнив, боится одиночества. Придирчив. Транжирит деньги.',l:'Проработать обиды, научиться доверять, выходить в мир, открываться людям.'},
10:{n:'Фортуна, Удача',p:'Счастливчик, помогают Высшие силы. Живёт в потоке, видит знаки, доверяет Богу. Талисман для других. Не работает по графику. Компанейский. Принимает цикличность.',m:'Живёт трудно, «день сурка». Ленив, пассивен, откладывает. Нет целей, не развивается. Под влиянием других. Пагубные привычки. Несамостоятелен. Шопоголик.',l:'Научиться расслабляться, чувствовать поток, развивать интуицию.'},
11:{n:'Сила, Потенциал',p:'Огромная жизненная энергия, не сидит без дела, многозадачен. Управляет ситуацией. Влияет на людей, ведёт за собой. Революционер с внутренним стержнем. Физически силён. Разорвал пуповину с мамой.',m:'Давление и агрессия. Трудоголизм. Грубость, физическая агрессия. Апатия, депрессия. Мужской характер у женщин. Лишний вес от нерастраченной энергии. Пуповина с мамой.',l:'Понять, куда идут силы. Вырабатывать любовь и принятие людей.'},
12:{n:'Новое видение, Служение',p:'Добр, милосерден, сострадателен. Видит миссию в служении. Отзывчивое сердце, благотворительность. Умеет говорить «нет». Креативное мышление. Любит безусловно.',m:'Любит страдать, обидчив, раним. Одиночество, депрессия. Сложности с выбором. Паника. Привязчивость. Негативное мышление. Не умеет говорить «нет». Работает за «спасибо».',l:'Учиться не только отдавать, но и принимать. Говорить «нет». Любить себя.'},
13:{n:'Трансформация',p:'Загадочный, непредсказуемый. Любит экстрим. Трансформации каждый день. Запускает перемены в жизни людей. Любознателен, креативен. Решителен, не паникует. Не боится смерти.',m:'Агрессивен, резок. Навязывает мнение и перемены. Хладнокровен, равнодушен к боли. Не доводит до конца. Боится за близких. Боится старости и смерти. Суицидальные наклонности.',l:'Умение отпускать, начинать новые циклы. Помнить о ценности жизни.'},
14:{n:'Искусство, Зрелая душа, Умеренность',p:'Тонко чувствующий, эмоциональный, глубокая душа. Доброжелателен, открыт. Творчество, единомышленники. Поэзия, история. Связь с Ангелом. Дар целительства травами и водой.',m:'Не умеет прощать, груб. Раним, плаксив. Не верит в свои силы. Не может довольствоваться малым. Живёт не по средствам. Нетерпелив. Прибегает к допингам.',l:'Жить в радости. Слушать душу, раскрыть творческий потенциал.'},
15:{n:'Проявление, Искушение',p:'Большой запас энергии. Видит людей насквозь. Хороший психолог. Провоцирует слабости. Принимает теневые стороны. Управляет людьми. Оратор. Талантлив во многих сферах. Любит роскошь.',m:'Агрессивен, нетерпим к слабостям. Колкие замечания. Манипулятор. Зависимости. Чёрная магия. Провоцирует негатив. Криминал, нечестный заработок.',l:'Принять свои особенности, использовать во благо. Развиваться духовно.'},
16:{n:'Духовное преображение',p:'Духовный лидер, серьёзные знания. Несёт людям новое. Саморазвитие. Эффективен в реконструкциях. Нет зацепок за материю. Спокойно проходит отсутствие любви. Перемены принимает с благодарностью.',m:'Агрессивен, не контролирует эмоции. Узкое мышление, зацепки за материальный мир. Не желает развиваться. Хаос в жизни. Травмы, зависимости. Не умеет чередовать активность и покой.',l:'Стремиться к осознанной жизни, не бояться перемен, духовно работать над собой.'},
17:{n:'Звезда, Популярность',p:'Неординарный, яркий, заметен в коллективе. Заявляет о себе, не боится сцены. Творческие способности. Любит, когда хвалят. Радостный, отзывчивый. Профессионал. Экстрасенсорика.',m:'Несамостоятелен, не верит в силы. Апатия, слабохарактерность. Комплексы, скрывает талант. «Серая мышка». Эгоизм, гордыня, «звёздная болезнь». Верит в панацею. Играет в лотереи.',l:'Раскрыть творчество и наладить взаимосвязь с небом.'},
18:{n:'Магия, Луна, Освобождение',p:'Богатый внутренний мир, загадочен. Материализует пространство силой мысли. Переключает внимание с негатива. Мистические способности. Пророческие сны. Зависит от лунных циклов. Позитивное мышление.',m:'Подавленное состояние, депрессии, нерешителен. Любит одиночество. Не понимает предназначения, страхи и фобии. Апатия. Уход от реальности через зависимости. Чёрная магия. Лишний вес.',l:'Развивать позитивное воображение, не уходить в негатив. Позитивная визуализация.'},
19:{n:'Солнце, Процветание, Изобилие',p:'Большой запас энергии и позитива. Открыт, непосредственен, радуется как ребёнок. Лидер, окружён людьми. Целеустремлён, активная позиция. Богат и процветает. Мир устроен просто и мудро.',m:'Зациклен на чём-то одном. «Залюбить» партнёра. Ограничивает общение. Разочарован в возможностях, ищет источник неудач. Стремится к деньгам, но беден. Чувство вины.',l:'Управлять своей энергией на благо. Чтобы солнышко было тёплым, мягким.'},
20:{n:'Яснознание, Связь с родом',p:'Склонен к экстрасенсорике и ясновидению. Талант целителя. Любит необычное. Пророческие сны, подсказки от умерших. Понимает философию жизни и смерти. Доступ к информации о душах. Не злопамятен.',m:'Агрессивен, осуждает людей. Давит, подчиняет. Или альтруизм без стержня. Отрыв от материального или зацепка за материю. Обиды на родителей. Родовые болезни. Хитроват, трусоват. Ленив.',l:'Прийти к небу, отработать родовую карму.'},
21:{n:'Мир, Миротворец',p:'Прирождённый миротворец и дипломат. Урегулирует любой конфликт. Связь со всем миром, глобальное мышление. Толерантен, нет границ. Путешествует, легко даются языки. Реализует глобальные проекты. Человек мира.',m:'Воинственен, не принимает других людей. Принципиален, категоричен, агрессивен. Хочет всё и сразу. Кредиты. Шаблонное мышление. Болезни, привязывающие к дому. Говорит «не знаю».',l:'Понять свою миротворческую миссию. Нести добро в мир и не бояться расширения.'},
22:{n:'Духовная свобода',p:'Внутренняя свобода. Лишён материальных привязанностей. Не любит ограничения и запреты. Путешествует, приключения и дорога. Открытое сердце, много друзей. Творческий, весёлый. Не поддаётся влиянию.',m:'Зависим от слабостей и обстоятельств. Сам создаёт рамки и становится их жертвой. Безответственная и разгульная жизнь. Постоянно произносит «нельзя». Материальная тюрьма. Ограничивает свободу других. Насмехается, чёрный юмор.',l:'Прийти к свободе, развиваться духовно, доверие Богу.'}
};

/* ============ SVG-ВИЗУАЛИЗАЦИЯ МАТРИЦЫ ============ */
function buildSVG(m){
  const C=260,R=180, pad=30;
  const cx=C, cy=C;
  const P = {top:[cx,cy-R], right:[cx+R,cy], bottom:[cx,cy+R], left:[cx-R,cy]};
  const Q = {tl:[cx-R/2,cy-R/2], tr:[cx+R/2,cy-R/2], br:[cx+R/2,cy+R/2], bl:[cx-R/2,cy+R/2]};
  const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t];
  // промежуточные точки (2 на каждой диагонали от вершины ромба к ромбу)
  const T = {
    // таланты: центр→top, две промежуточные
    t1: lerp([cx,cy],P.top,0.66), t2: lerp([cx,cy],P.top,0.33),
    // KH: центр→bottom
    k1: lerp([cx,cy],P.bottom,0.66), k2: lerp([cx,cy],P.bottom,0.33),
    // DR: центр→left
    d1: lerp([cx,cy],P.left,0.66), d2: lerp([cx,cy],P.left,0.33),
    // F: центр→right
    f1: lerp([cx,cy],P.right,0.66), f2: lerp([cx,cy],P.right,0.33),
    // род отца: TL→центр→BR
    roL1: lerp(Q.tl,[cx,cy],0.33), roL2: lerp(Q.tl,[cx,cy],0.66),
    roR1: lerp(Q.br,[cx,cy],0.66), roR2: lerp(Q.br,[cx,cy],0.33),
    // род матери: TR→центр→BL
    rmL1: lerp(Q.tr,[cx,cy],0.33), rmL2: lerp(Q.tr,[cx,cy],0.66),
    rmR1: lerp(Q.bl,[cx,cy],0.66), rmR2: lerp(Q.bl,[cx,cy],0.33)
  };
  const circ=(p,v,r=16,cls='')=>`<circle class="node ${cls}" cx="${p[0]}" cy="${p[1]}" r="${r}"/><text x="${p[0]}" y="${p[1]+5}" text-anchor="middle" font-size="${r>14?14:11}">${v}</text>`;
  const line=(a,b)=>`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}"/>`;

  return `<svg class="matrix-svg" viewBox="0 0 ${C*2} ${C*2}" xmlns="http://www.w3.org/2000/svg">
    <!-- ромб -->
    ${line(P.top,P.right)}${line(P.right,P.bottom)}${line(P.bottom,P.left)}${line(P.left,P.top)}
    <!-- квадрат -->
    ${line(Q.tl,Q.tr)}${line(Q.tr,Q.br)}${line(Q.br,Q.bl)}${line(Q.bl,Q.tl)}
    <!-- диагонали -->
    ${line(P.top,P.bottom)}${line(P.left,P.right)}
    ${line(Q.tl,Q.br)}${line(Q.tr,Q.bl)}
    <!-- узлы: ромб -->
    ${circ(P.top, m.B, 20,'big')}
    ${circ(P.left, m.A, 20,'big')}
    ${circ(P.right, m.C, 20,'big')}
    ${circ(P.bottom, m.D, 20,'big')}
    <!-- центр -->
    ${circ([cx,cy], m.E, 24,'center')}
    <!-- родовой квадрат -->
    ${circ(Q.tl, m.TL, 18,'big')}
    ${circ(Q.tr, m.TR, 18,'big')}
    ${circ(Q.br, m.BR, 18,'big')}
    ${circ(Q.bl, m.BL, 18,'big')}
    <!-- таланты -->
    ${circ(T.t2, m.T_mid, 11)}
    ${circ(T.t1, m.T_inner, 11)}
    <!-- KH -->
    ${circ(T.k2, m.KH_left, 11)}
    ${circ(T.k1, m.KH_right, 11)}
    <!-- DR -->
    ${circ(T.d2, m.DR_mid, 11)}
    ${circ(T.d1, m.DR_inner, 11)}
    <!-- F -->
    ${circ(T.f2, m.F_mid, 11)}
    ${circ(T.f1, m.F_cross, 11)}
    <!-- род отца -->
    ${circ(T.roL1, m.RO_mid_left, 11)}
    ${circ(T.roL2, m.RO_inner_left, 11)}
    ${circ(T.roR1, m.RO_mid_right, 11)}
    ${circ(T.roR2, m.RO_inner_right, 11)}
    <!-- род матери -->
    ${circ(T.rmL1, m.RM_mid_tr, 11)}
    ${circ(T.rmL2, m.RM_inner_tr, 11)}
    ${circ(T.rmR1, m.RM_mid_bl, 11)}
    ${circ(T.rmR2, m.RM_inner_bl, 11)}
  </svg>`;
}

/* ============ СБОРКА СЕКЦИЙ ============ */
const sec = (icon,title,body,open=false)=>`
  <div class="section${open?' open':''}">
    <div class="section-header"><h2><span class="icon">${icon}</span>${title}</h2><span class="chev">▼</span></div>
    <div class="section-body"><div class="section-inner">${body}</div></div>
  </div>`;

const kHKey = (a,b,c)=>`${a}/${b}/${c}`;
function khLookup(m){
  const variants = [
    kHKey(m.KH_bottom,m.KH_right,m.KH_left),
    kHKey(m.KH_bottom,m.KH_left,m.KH_right),
    kHKey(m.KH_left,m.KH_right,m.KH_bottom),
    kHKey(m.KH_left,m.KH_bottom,m.KH_right),
    kHKey(m.KH_right,m.KH_left,m.KH_bottom),
    kHKey(m.KH_right,m.KH_bottom,m.KH_left)
  ];
  for (const v of variants){ if (KH[v]) return {key:v,data:KH[v]}; }
  return null;
}

function energyCard(num,extra=''){
  const e = EN[num];
  if (!e) return `<p>Энергия ${num}.</p>`;
  return `
    <div class="tag-row"><span class="tag">Аркан ${num}</span><span class="tag">${e.n}</span></div>
    <div class="block-title">✦ В плюсе</div><p>${e.p}</p>
    <div class="block-title">▼ В минусе</div><p>${e.m}</p>
    <div class="block-title">Урок</div><p><em>${e.l}</em></p>
    ${extra}`;
}

    <div class="numbers-row">
      <div class="num-badge"><div class="label">Центр</div><div class="value">${m.E}</div><div class="planet">Характер</div></div>
      <div class="num-badge"><div class="label">День</div><div class="value">${m.A}</div><div class="planet">Личность</div></div>
      <div class="num-badge"><div class="label">Год</div><div class="value">${m.C}</div><div class="planet">Судьба</div></div>

  /* SVG */
  R.push(sec('❖','Матрица', buildSVG(m), false));

  /* ОБЩАЯ ХАРАКТЕРИСТИКА (открыта) */
  const centerE = EN[m.E];
  R.push(sec('☉','Общая характеристика', `
    <div class="block-title">Ключевые числа</div>
    <div class="tag-row">
      <span class="tag">Центр: ${m.E} — ${centerE.n}</span>
      <span class="tag">Личность: ${m.A}</span>
      <span class="tag">Судьба: ${m.C}</span>

  `, true));

    const d = kh.data;
    R.push(sec('▼',`Кармический хвост · ${m.KH_bottom}-${m.KH_left}-${m.KH_right}`, `
      <div class="tag-row"><span class="tag">${d.t}</span><span class="tag">${kh.key}</span></div>

      <div class="block-title">Урок и рекомендации</div><p><em>${d.u}</em></p>
    `));
  } else {
    R.push(sec('▼',`Кармический хвост · ${m.KH_bottom}-${m.KH_left}-${m.KH_right}`, `
      <p>Три нижние энергии: <strong>${m.KH_bottom}</strong>, <strong>${m.KH_left}</strong>, <strong>${m.KH_right}</strong>.</p>
      <div class="block-title">Нижняя вершина · ${m.KH_bottom}</div>${energyCard(m.KH_bottom)}
      <div class="block-title">Левая энергия хвоста · ${m.KH_left}</div>${energyCard(m.KH_left)}
      <div class="block-title">Правая энергия хвоста · ${m.KH_right}</div>${energyCard(m.KH_right)}
    `));
  }

  /* ТАЛАНТЫ */
  R.push(sec('★','Таланты и духовные задачи', `
    <p>Три энергии вверху матрицы — таланты, данные от рождения.</p>
    <div class="info-grid">
      <div class="info-cell"><div class="k">Сахасрара</div><div class="v">${m.T_top} — ${EN[m.T_top].n}</div></div>
      <div class="info-cell"><div class="k">Аджна</div><div class="v">${m.T_mid} — ${EN[m.T_mid].n}</div></div>
      <div class="info-cell"><div class="k">Вишудха</div><div class="v">${m.T_inner} — ${EN[m.T_inner].n}</div></div>
      <div class="info-cell"><div class="k">Ключ талантов</div><div class="v">${m.T_top}-${m.T_mid}-${m.T_inner}</div></div>
    </div>
    ${energyCard(m.T_top)}
    ${energyCard(m.T_mid)}
    ${energyCard(m.T_inner)}
  `));

  /* ПРЕДНАЗНАЧЕНИЯ */
  R.push(sec('⚭','Предназначения', `
    <div class="block-title">Личное предназначение (до 40 лет) · ${m.LP}</div>
    <p>Линия Неба: ${m.sky} · Линия Земли: ${m.earth} · ЛП = ${m.LP}</p>
    ${energyCard(m.LP)}
    <div class="block-title">Социальное предназначение (после 40) · ${m.SP}</div>
    <p>Род отца: ${m.M} · Род матери: ${m.J} · СП = ${m.SP}</p>
    ${energyCard(m.SP)}
    <div class="block-title">Духовное предназначение (после 60, бонус) · ${m.DP}</div>
    <p>ДП = ЛП + СП = ${m.DP}</p>
    ${energyCard(m.DP)}
  `));

  /* КАНАЛ ОТНОШЕНИЙ */
  const rel = REL[m.F_rel] || REL[1];
  R.push(sec('❋',`Канал отношений · ${m.F_rel}`, `
    <p>Центр отношений: <strong>${m.F_rel}</strong> — ${EN[m.F_rel].n}</p>
    <div class="block-title">Партнёр в плюсе</div><p>${rel.p}</p>
    <div class="block-title">Партнёр в минусе</div><p>${rel.m}</p>
    <div class="block-title">Дополнительно</div>
    <div class="info-grid">
      <div class="info-cell"><div class="k">Стык с финансами</div><div class="v">${m.F_cross}</div></div>
      <div class="info-cell"><div class="k">Влияние на деньги</div><div class="v">${EN[m.F_cross].n}</div></div>
    </div>
  `));

  /* ФИНАНСОВЫЙ КАНАЛ */
  R.push(sec('$',`Финансовый канал · ${m.F_fin}`, `
    <p>Центр финансов: <strong>${m.F_fin}</strong> — ${EN[m.F_fin].n}</p>
    <div class="block-title">Сфера реализации</div><p>${FIN[m.F_fin]||'—'}</p>
    <div class="block-title">Материальная карма прошлого · ${m.MatKarma}</div>
    ${energyCard(m.MatKarma)}
    <div class="block-title">На что тратить</div>
    <p>Часть дохода направляйте в энергию центра финансов — поддерживайте то, что соответствует аркану <strong>${m.F_fin}</strong>.</p>
  `));

  /* РОД ОТЦА */
  R.push(sec('▲',`Род отца · ${m.M}`, `
    <p>Мужская линия: ${m.TL}-${m.RO_mid_left}-${m.RO_inner_left}-${m.E}-${m.RO_inner_right}-${m.RO_mid_right}-${m.BR}</p>
    <div class="block-title">Талант от рода · ${m.TL}</div>${energyCard(m.TL)}
    <div class="block-title">Духовные задачи по роду · ${m.RO_mid_left}</div>${energyCard(m.RO_mid_left)}
    <div class="block-title">Карма отца · ${m.BR}</div>${energyCard(m.BR)}
  `));

  /* РОД МАТЕРИ */
  R.push(sec('▼',`Род матери · ${m.J}`, `
    <p>Женская линия: ${m.TR}-${m.RM_mid_tr}-${m.RM_inner_tr}-${m.E}-${m.RM_inner_bl}-${m.RM_mid_bl}-${m.BL}</p>
    <div class="block-title">Талант от рода · ${m.TR}</div>${energyCard(m.TR)}
    <div class="block-title">Духовные задачи по роду · ${m.RM_mid_tr}</div>${energyCard(m.RM_mid_tr)}
    <div class="block-title">Карма матери · ${m.BL}</div>${energyCard(m.BL)}
  `));

  /* ДЕТСКО-РОДИТЕЛЬСКИЙ КАНАЛ */
  R.push(sec('☾',`Детско-родительский канал · ${m.DR_outer}-${m.DR_mid}-${m.DR_inner}`, `
    <div class="info-grid">
      <div class="info-cell"><div class="k">Для чего душа пришла</div><div class="v">${m.DR_outer} — ${EN[m.DR_outer].n}</div></div>
      <div class="info-cell"><div class="k">Задача отношений</div><div class="v">${m.DR_mid} — ${EN[m.DR_mid].n}</div></div>
      <div class="info-cell"><div class="k">Ошибки</div><div class="v">${m.DR_inner} — ${EN[m.DR_inner].n}</div></div>
    </div>
    ${energyCard(m.DR_mid)}
    ${energyCard(m.DR_inner)}
    <div class="warning">Третья энергия показывает ошибки в отношениях с родителями и своими детьми. Прорабатывайте её в первую очередь.</div>
  `));

  /* ПРЕДОСТЕРЕЖЕНИЯ */
  R.push(sec('⚠','Предостережения и рекомендации', `
    <p>Начинайте работу с матрицей с <strong>кармического хвоста</strong> — это фундамент жизни. Далее — центральная энергия (характер) и портрет личности. После вывода их в плюс переходите к родовым программам.</p>
    <div class="block-title">Общий порядок проработки</div>
    <div class="info-grid">
      <div class="info-cell"><div class="k">Шаг 1</div><div class="v">Кармический хвост ${m.KH_bottom}-${m.KH_left}-${m.KH_right}</div></div>
      <div class="info-cell"><div class="k">Шаг 2</div><div class="v">Центр (характер) ${m.E}</div></div>
      <div class="info-cell"><div class="k">Шаг 3</div><div class="v">Портрет личности ${m.A}</div></div>
      <div class="info-cell"><div class="k">Шаг 4</div><div class="v">Предназначения</div></div>
    </div>
    <div class="warning">Помните: энергии не бывают «плохими» или «хорошими» — таковыми их делаем мы своими мыслями, словами и поступками. Знание плюсов и минусов помогает быстро выходить из минуса.</div>
  `));

  /* СОВМЕСТИМОСТЬ */
  R.push(sec('❖','Совместимость', `
    <p>Для расчёта совместимости с партнёром сопоставьте ваши центры, каналы отношений и кармические хвосты.</p>
    <div class="info-grid">
      <div class="info-cell"><div class="k">Ваш центр</div><div class="v">${m.E} — ${EN[m.E].n}</div></div>
      <div class="info-cell"><div class="k">Канал отношений</div><div class="v">${m.F_rel} — ${EN[m.F_rel].n}</div></div>
      <div class="info-cell"><div class="k">Ваш KH</div><div class="v">${m.KH_bottom}-${m.KH_left}-${m.KH_right}</div></div>
      <div class="info-cell"><div class="k">Духовное предназначение</div><div class="v">${m.DP} — ${EN[m.DP].n}</div></div>
    </div>
    <div class="warning">Если партнёр «по минусу» — не пытайтесь его переделать. Выводите в плюс свой аркан: именно ваш минус притянул такого партнёра.</div>
  `));

  /* ПРОГНОЗ НА ГОД */
  R.push(sec('✦',`Прогноз на ${m.currentYear} · ${m.yearNum}`, `
    <p>Число года: <strong>${m.yearNum}</strong> — ${EN[m.yearNum].n}</p>
    ${energyCard(m.yearNum)}
    <div class="mantra">Биджа-мантра года: <strong>${EN[m.yearNum].n}</strong></div>
  `));

  document.getElementById('results').innerHTML = R.join('');
  document.querySelectorAll('.section-header').forEach(h=>{
    h.addEventListener('click',()=>h.parentElement.classList.toggle('open'));
  });
}

/* ============ UI ============ */
const fioI=document.getElementById('fio');
const bdI=document.getElementById('bdate');
const calcBtn=document.getElementById('calcBtn');
const loading=document.getElementById('loading');
const resetBtn=document.getElementById('resetBtn');

calcBtn.addEventListener('click',()=>{
  const fio=fioI.value.trim();
  const v=bdI.value;
  if (!v){ notify('Укажите дату рождения'); return; }
  const [y,mo,d]=v.split('-').map(Number);
  if (!d||!mo||!y){ notify('Некорректная дата'); return; }
  loading.classList.add('show');
  document.getElementById('results').innerHTML='';
  resetBtn.classList.remove('show');
  setTimeout(()=>{
    try{
      const m=calcMatrix(d,mo,y);
      render(m);
      loading.classList.remove('show');
      resetBtn.classList.add('show');
    }catch(e){
      loading.classList.remove('show');
      notify('Ошибка расчёта: '+e.message);
    }
  },400);
});

resetBtn.addEventListener('click',()=>{
  document.getElementById('results').innerHTML='';
  resetBtn.classList.remove('show');
  fioI.value=''; bdI.value='';
  window.scrollTo({top:0,behavior:'smooth'});
});
</script>
</body>
</html>
